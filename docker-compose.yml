version: '3.8'
services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - red-monitoreo

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - red-monitoreo
  
  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    networks:
      - red-monitoreo

networks:
  red-monitoreo:
    driver: bridge
